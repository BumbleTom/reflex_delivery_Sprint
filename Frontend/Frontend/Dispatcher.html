<!DOCTYPE html>
<html>
<head>
  <title>Dispatcher Dashboard</title>
</head>
<body>
  <h1>Dispatcher Dashboard</h1>
  <form id="assignForm">
    <input type="number" id="request_id" placeholder="Request ID" required>
    <input type="number" id="rider_id" placeholder="Rider ID" required>
    <button type="submit">Assign Rider</button>
  </form>

  <a href="index.html">Back to Retailer Dashboard</a><br>
  <a href="rider-dashboard.html">Go to Rider Dashboard</a>

  <script>
    document.getElementById('assignForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const response = await fetch('https://reflex-backend.onrender.com/api/dispatchers/assign', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          request_id: document.getElementById('request_id').value,
          rider_id: document.getElementById('rider_id').value
        })
      });
      const data = await response.json();
      alert('Assigned: ' + JSON.stringify(data));
    });
  </script>
</body>
</html>
