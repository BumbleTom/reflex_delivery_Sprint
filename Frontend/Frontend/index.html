<!DOCTYPE html>
<html>
<head>
  <title>Retailer Dashboard</title>
</head>
<body>
  <h1>Retailer Dashboard</h1>
  <form id="requestForm">
    <input type="text" id="retailer_id" placeholder="Retailer ID" required>
    <input type="text" id="customer_name" placeholder="Customer Name" required>
    <input type="text" id="item" placeholder="Item" required>
    <button type="submit">Submit Request</button>
  </form>

  <a href="dispatcher-dashboard.html">Go to Dispatcher Dashboard</a><br>
  <a href="rider-dashboard.html">Go to Rider Dashboard</a>

  <script>
    document.getElementById('requestForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const response = await fetch('https://reflex-backend.onrender.com/api/retailers/request', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          retailer_id: document.getElementById('retailer_id').value,
          customer_name: document.getElementById('customer_name').value,
          item: document.getElementById('item').value
        })
      });
      const data = await response.json();
      alert('Request logged: ' + JSON.stringify(data));
    });
  </script>
</body>
</html>
