<!DOCTYPE html>
<html>
<head>
  <title>Rider Dashboard</title>
</head>
<body>
  <h1>Rider Dashboard</h1>
  <form id="updateForm">
    <input type="number" id="rider_id" placeholder="Rider ID" required>
    <select id="status" required>
      <option value="Picked Up">Picked Up</option>
      <option value="Delivered">Delivered</option>
    </select>
    <button type="submit">Update Status</button>
  </form>

  <a href="index.html">Back to Retailer Dashboard</a><br>
  <a href="dispatcher-dashboard.html">Go to Dispatcher Dashboard</a>

  <script>
    document.getElementById('updateForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const response = await fetch('https://reflex-backend.onrender.com/api/riders/update', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          rider_id: document.getElementById('rider_id').value,
          status: document.getElementById('status').value
        })
      });
      const data = await response.json();
      alert('Status updated: ' + JSON.stringify(data));
    });
  </script>
</body>
</html>
